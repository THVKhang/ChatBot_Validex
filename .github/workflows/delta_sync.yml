name: Delta Sync — Weekly Legal Data Update

on:
  schedule:
    # Run every Sunday at 2:00 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report changes without applying)'
        type: boolean
        default: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  EMBEDDING_PROVIDER: google

jobs:
  delta-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Delta Sync (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' || github.event_name == 'schedule' }}
        run: |
          python -m app.delta_sync --dry-run
        continue-on-error: true

      - name: Run Delta Sync (apply changes)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          # Step 1: Detect and repeal changed content
          python -m app.delta_sync
          
          # Step 2: Re-collect sources (only changed URLs will be re-processed)
          python -m app.collect_au_sources
          
          # Step 3: Re-ingest into PGVector (only changed chunks will be embedded)
          python -m app.ingest_pgvector

      - name: Upload changelog artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delta-changelog-${{ github.run_number }}
          path: data/canonical/delta_changelog.jsonl
          retention-days: 90
